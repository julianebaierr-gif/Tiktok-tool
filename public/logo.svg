<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <!-- Premium Midnight Canvas Gradient -->
    <linearGradient id="emblemBgClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Dual Tone Tik Flow Gradient -->
    <linearGradient id="tikDualClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="50%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Wordmark Tik Gradient -->
    <linearGradient id="tikWordClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="borderSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FE2C55" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (60x60 centered vertically) -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="18" fill="url(#emblemBgClean)" />
    <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="17.25" fill="none" stroke="url(#borderSubtle)" stroke-width="1.5" />

    <!-- Q Ring -->
    <path 
      d="M 30 11 
         C 19.5 11 11 19.5 11 30 
         C 11 40.5 19.5 49 30 49 
         C 34.6 49 38.9 47.3 42.2 44.5 
         L 45.4 47.7 
         C 46.1 48.4 47.1 48.4 47.8 47.7 
         C 48.5 47.0 48.5 46.0 47.8 45.3 
         L 44.7 42.2 
         C 47.4 38.8 49 34.6 49 30 
         C 49 19.5 40.5 11 30 11 Z 
         M 30 17 
         C 37.2 17 43 22.8 43 30 
         C 43 33.4 41.7 36.5 39.6 38.8 
         L 35.7 34.9 
         C 35.1 34.3 34.2 34.3 33.6 34.9 
         C 33.0 35.5 33.0 36.4 33.6 37.0 
         L 36.5 39.9 
         C 34.6 42.0 32.4 43 30 43 
         C 22.8 43 17 37.2 17 30 
         C 17 22.8 22.8 17 30 17 Z" 
      fill="url(#tikDualClean)" 
    />

    <!-- Precision Arrow -->
    <path d="M 27 21 L 33 21 L 33 29 L 37 29 L 30 37 L 23 29 L 27 29 Z" fill="#FFFFFF" />
    <rect x="23" y="39.5" width="14" height="2" rx="1" fill="#25F4EE" />
  </g>

  <!-- Typography & Exact Tagline -->
  <g transform="translate(86, 43)">
    <!-- QukTik Wordmark -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em">
      <tspan fill="#0F172A">Quk</tspan><tspan fill="url(#tikWordClean)">Tik</tspan>
    </text>
  </g>

  <!-- Clean Human Subtitle: Identical to Header & Footer -->
  <g transform="translate(88, 62)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="0.08em">
      TIKTOK &amp; DOUYIN VIDEO DOWNLOADER
    </text>
  </g>
</svg>