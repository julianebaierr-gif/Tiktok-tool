<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Speed Gradient -->
    <linearGradient id="neonSpeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Tik Gradient Wordmark -->
    <linearGradient id="tikWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="emblemShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF007A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ================= LEFT EMBLEM ================= -->
  <g transform="translate(10, 10)">
    <!-- Squircle Base -->
    <rect width="70" height="70" rx="20" fill="url(#emblemBg)" />
    <rect x="0.8" y="0.8" width="68.4" height="68.4" rx="19.2" fill="none" stroke="url(#neonSpeed)" stroke-width="1.6" opacity="0.85" />

    <!-- Stylized Q-Ring with Dynamic Lightning Tail -->
    <path 
      d="M 35 12 
         C 22.3 12 12 22.3 12 35 
         C 12 47.7 22.3 58 35 58 
         C 40.8 58 46.1 55.9 50.1 52.4 
         L 54.5 56.8 
         C 55.5 57.8 57.1 57.8 58.1 56.8 
         C 59.1 55.8 59.1 54.2 58.1 53.2 
         L 53.8 48.9 
         C 56.4 44.9 58 40.1 58 35 
         C 58 22.3 47.7 12 35 12 Z 
         M 35 20 
         C 43.3 20 50 26.7 50 35 
         C 50 39.2 48.3 43 45.5 45.8 
         L 41.5 41.8 
         C 40.7 41 39.4 41.2 38.8 42.1 
         C 38.4 42.8 38.4 43.6 38.8 44.3 
         L 41.2 48.5 
         C 39.3 49.5 37.2 50 35 50 
         C 26.7 50 20 43.3 20 35 
         C 20 26.7 26.7 20 35 20 Z" 
      fill="url(#neonSpeed)" 
    />

    <!-- Speed Downloader Arrow -->
    <path d="M 32 24 L 38 24 L 38 34 L 43 34 L 35 44 L 27 34 L 32 34 Z" fill="#FFFFFF" />
    
    <!-- Tray Line -->
    <rect x="25" y="47" width="20" height="2.5" rx="1.25" fill="#00F2FE" />

    <!-- Sparkle Star -->
    <circle cx="52" cy="16" r="2" fill="#00F2FE" filter="url(#logoGlow)" />
  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <!-- "QukTik" Title -->
  <g transform="translate(98, 48)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em">
      <tspan fill="#0F172A">Quk</tspan><tspan fill="url(#tikWordGrad)">Tik</tspan>
    </text>
  </g>

  <!-- "FAST HD" Modern Pill Badge -->
  <g transform="translate(230, 24)">
    <rect width="60" height="22" rx="11" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#F43F5E" />
    <text x="20" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#E11D48" letter-spacing="0.08em">FAST HD</text>
  </g>

  <!-- Subtitle: Clean Video Downloader -->
  <g transform="translate(100, 68)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.06em">
      ULTRA-FAST VIDEO DOWNLOADER
    </text>
  </g>
</svg>