<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Premium Midnight Canvas Gradient -->
    <linearGradient id="humanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Refined TikTok / Modern Stream Dual Tone Gradient -->
    <linearGradient id="humanBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="45%" stop-color="#00D2FF" />
      <stop offset="55%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <!-- Subtle Clean Outer Border -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FE2C55" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Human Drop Shadow -->
    <filter id="humanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Clean Rounded Container (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#humanBg)" />
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="url(#subtleBorder)" stroke-width="1.5" />

  <!-- Iconic Q + Stream Downloader Emblem -->
  <g filter="url(#humanShadow)">
    <!-- Outer 'Q' Ring: Geometric, Balanced, Continuous -->
    <path 
      d="M 64 24 
         C 41.9 24 24 41.9 24 64 
         C 24 86.1 41.9 104 64 104 
         C 73.8 104 82.8 100.5 89.8 94.6 
         L 96.5 101.3 
         C 97.9 102.7 100.1 102.7 101.5 101.3 
         C 102.9 99.9 102.9 97.7 101.5 96.3 
         L 95 89.8 
         C 100.6 82.7 104 73.7 104 64 
         C 104 41.9 86.1 24 64 24 Z 
         M 64 36 
         C 79.5 36 92 48.5 92 64 
         C 92 71.2 89.3 77.8 84.8 82.8 
         L 76.5 74.5 
         C 75.3 73.3 73.3 73.3 72.1 74.5 
         C 70.9 75.7 70.9 77.7 72.1 78.9 
         L 78.2 85 
         C 73.9 89.4 69.1 92 64 92 
         C 48.5 92 36 79.5 36 64 
         C 36 48.5 48.5 36 64 36 Z" 
      fill="url(#humanBrandGrad)" 
    />

    <!-- Precision Downward Media Arrow -->
    <path 
      d="M 58 46 
         L 70 46 
         L 70 62 
         L 78 62 
         L 64 78 
         L 50 62 
         L 58 62 
         Z" 
      fill="#FFFFFF" 
    />

    <!-- Stream Cradle / Audio-Video Base Bar -->
    <rect x="49" y="83" width="30" height="4" rx="2" fill="#25F4EE" />
  </g>
</svg>