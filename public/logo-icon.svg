<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Gradient (Tik / Quk Speed) -->
    <linearGradient id="neonQGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#4FACFE" />
      <stop offset="70%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Download Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Cyan Pulse Accent -->
    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="ambientGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF007A" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.3" />
    </filter>

    <!-- Inner Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame with Glowing Border -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#squircleBg)" />
  <rect x="4" y="4" width="120" height="120" rx="34" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Dynamic Ambient Backlight -->
  <circle cx="64" cy="64" r="38" fill="url(#neonQGrad)" opacity="0.18" filter="url(#ambientGlow)" />

  <!-- Main QukTik Emblem -->
  <g filter="url(#iconShadow)">
    <!-- Outer 'Q' Ring with Bold Geometric Flow & Lightning Kick -->
    <!-- The outer loop is an energetic racetrack with an open gap at bottom-right for the lightning tail -->
    <path 
      d="M 64 22 
         C 40.8 22 22 40.8 22 64 
         C 22 87.2 40.8 106 64 106 
         C 74.5 106 84.1 102.2 91.5 95.8 
         L 98.2 102.5 
         C 99.8 104.1 102.5 104.1 104.1 102.5 
         C 105.7 100.9 105.7 98.2 104.1 96.6 
         L 97.2 89.7 
         C 102.7 82.5 106 73.6 106 64 
         C 106 40.8 87.2 22 64 22 Z 
         M 64 36 
         C 79.5 36 92 48.5 92 64 
         C 92 71.4 89.1 78.1 84.4 83.1 
         L 77.2 75.9 
         C 75.8 74.5 73.5 74.8 72.5 76.5 
         C 71.8 77.7 71.8 79.2 72.5 80.4 
         L 76.8 87.7 
         C 73 89.8 68.6 91 64 91 
         C 49.1 91 37 78.9 37 64 
         C 37 49.1 49.1 36 64 36 Z" 
      fill="url(#neonQGrad)" 
    />

    <!-- Speed Lightning Bolt & Download Arrow Fused at the Center -->
    <!-- Downward Arrow Shaft & Head -->
    <path 
      d="M 59 44 
         L 69 44 
         L 69 61 
         L 78 61 
         L 64 78 
         L 50 61 
         L 59 61 
         Z" 
      fill="url(#arrowGrad)" 
    />

    <!-- Horizontal Catch Tray / Base Line -->
    <path 
      d="M 48 83 
         L 80 83 
         C 81.6 83 83 84.4 83 86 
         C 83 87.6 81.6 89 80 89 
         L 48 89 
         C 46.4 89 45 87.6 45 86 
         C 45 84.4 46.4 83 48 83 Z" 
      fill="url(#pulseCyan)" 
    />

    <!-- Pristine 1080p Sparkle Star at Top Right -->
    <path 
      d="M 94 28 
         C 94 32 98 32 98 32 
         C 98 32 94 32 94 36 
         C 94 32 90 32 90 32 
         C 90 32 94 32 94 28 Z" 
      fill="#00F2FE" 
      filter="url(#ambientGlow)"
    />
  </g>
</svg>